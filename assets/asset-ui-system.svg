<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <title>产品 UI 规范</title>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b1dbff" stop-opacity=".85"/><stop offset="1" stop-color="#507fdd" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#dceaff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#769df3"/><stop offset="1" stop-color="#3b66c6"/>
