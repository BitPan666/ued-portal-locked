    <path d="M14 12h26a4 4 0 0 1 4 4v4H10v-4a4 4 0 0 1 4-4Z" fill="url(#header)"/>
    <circle cx="14.5" cy="16" r="1.1" fill="#eaf3ff"/>
    <circle cx="18.5" cy="16" r="1.1" fill="#c7ddff"/>
    <rect x="14" y="24" width="6" height="13" rx="1.8" fill="url(#component)"/>
    <rect x="24" y="24" width="16" height="5" rx="1.5" fill="#93baff"/>
    <rect x="24" y="32" width="6.5" height="5" rx="1.3" fill="#b8ccec"/>
